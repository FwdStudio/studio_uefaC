<!DOCTYPE html><html lang="it"><head><title>Il mio foglio</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1f6feb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Studio UEFA C">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5d6672;--bd:#dfe3e8;--a:#1f6feb;--ok:#2da44e;--ko:#c2397a;--wa:#d4731a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--card:#181e26;--tx:#e8ecf1;--mut:#9aa5b1;--bd:#2a323d;--a:#5b9bff;--ok:#4cc26b;--ko:#ee6fa8;--wa:#f0993f}}
*,*::before,*::after{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}h1{font-size:1.3rem;margin:4px 0 6px}h2{font-size:1.1rem;margin:10px 0}h3{font-size:.85rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 0 8px}
.m{color:var(--mut);font-size:.88rem}a{color:var(--a)}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;width:100%;text-align:left;margin:0 0 8px}
button.pri{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}button:disabled{opacity:.4}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 button{margin:0;text-align:center}
.card{display:block;text-decoration:none;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--k,var(--a));border-radius:12px;padding:11px 13px;margin:0 0 8px}.card b{display:block}.card span{font-size:.84rem;color:var(--mut)}
</style>
</head><body><main>
<p><a href="index.html">← Indice</a></p><h1>📒 Il mio foglio</h1>
<p class="m">Le parole chiave che hai evidenziato nelle mappe, nei testi e nei ripassi. Restano solo su questo telefono. Per evidenziare: seleziona un testo e tocca «★ Evidenzia e salva».</p>
<input id="q" placeholder="Cerca nel foglio…" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px">
<div class="g2"><button id="cp">Copia tutto</button><button id="sh">Condividi / esporta</button></div>
<h3>Aggiungi una nota tua</h3>
<textarea id="nt" rows="2" placeholder="Scrivi una nota o una parola chiave…" style="width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit"></textarea>
<button id="ad" style="margin-top:8px">Aggiungi al foglio</button>
<div id="list"></div>
<button id="clr" style="margin-top:14px">Cancella tutto il foglio</button>
<style>.it{background:var(--card);border:1px solid var(--bd);border-left:5px solid #f5b700;border-radius:12px;padding:10px 12px;margin:0 0 8px}.it small{color:var(--mut);display:block;margin-top:4px}.it .ac{display:flex;gap:10px;margin-top:6px}.it .ac button,.it .ac a{width:auto;margin:0;padding:6px 10px;font-size:.85rem;text-decoration:none;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}</style>
</main>
<script>
var K="uc_notes";
function load(){try{return JSON.parse(localStorage.getItem(K))||[]}catch(e){return[]}}
function save(a){try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}}
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){var a=load(),q=document.getElementById("q").value.toLowerCase(),g={},o=[];
a.forEach(function(x,i){if(q&&(x.t+" "+x.m).toLowerCase().indexOf(q)<0)return;var k=x.m||"Note personali";(g[k]=g[k]||[]).push([x,i])});
Object.keys(g).sort().forEach(function(k){o.push("<h3>"+e(k)+"</h3>");g[k].forEach(function(p){var x=p[0];o.push('<div class="it"><div>'+e(x.t)+'</div><small>'+(x.k?e(x.k)+" · ":"")+new Date(x.d).toLocaleDateString("it-IT")+'</small><div class="ac">'+(x.p?'<a href="'+e(x.p)+'">Apri la pagina</a>':"")+'<button onclick="ed('+p[1]+')">Modifica</button><button onclick="del('+p[1]+')">Elimina</button></div></div>')})});
document.getElementById("list").innerHTML=o.length?o.join(""):'<p class="m" style="margin-top:14px">Il foglio è vuoto. Apri una mappa, seleziona una parola chiave e tocca «★ Evidenzia e salva».</p>'}
function del(i){var a=load();a.splice(i,1);save(a);render()}
function ed(i){var a=load(),v=prompt("Modifica la nota",a[i].t);if(v&&v.trim()){a[i].t=v.trim();save(a);render()}}
function txt(){var a=load(),g={};a.forEach(function(x){var k=x.m||"Note personali";(g[k]=g[k]||[]).push(x.t)});return Object.keys(g).sort().map(function(k){return"## "+k+"\n"+g[k].map(function(t){return"- "+t}).join("\n")}).join("\n\n")}
document.getElementById("q").oninput=render;
document.getElementById("ad").onclick=function(){var v=document.getElementById("nt").value.trim();if(!v)return;var a=load();a.push({t:v,p:"",m:"Note personali",k:"",d:Date.now()});save(a);document.getElementById("nt").value="";render()};
document.getElementById("cp").onclick=function(){var t=txt();if(!t){alert("Il foglio è vuoto");return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){alert("Copiato negli appunti")},function(){alert("Copia non riuscita")})}else{var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");alert("Copiato negli appunti")}catch(x){alert("Copia non riuscita")}ta.remove()}};
document.getElementById("sh").onclick=function(){var t=txt();if(!t){alert("Il foglio è vuoto");return}if(navigator.share){navigator.share({title:"Il mio foglio – Studio UEFA C",text:t}).catch(function(){})}else{var b=new Blob([t],{type:"text/plain"}),u=URL.createObjectURL(b),l=document.createElement("a");l.href=u;l.download="foglio-appunti.txt";document.body.appendChild(l);l.click();l.remove()}};
document.getElementById("clr").onclick=function(){if(load().length&&confirm("Cancellare tutto il foglio?")){save([]);render()}};
render();
</script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js")</script></body></html>
